version: '3.8'

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bevin-portfolio
    image: bevin-portfolio:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "com.bevinportfolio.description=Bevin Joy G Portfolio Website"
      - "com.bevinportfolio.maintainer=bevinjoy1019@gmail.com"

